name: Build Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build app, uninstaller and installer from source
        shell: pwsh
        run: ./installer/build.ps1
      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Veyro-windows-x64-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            publish/Veyro.exe
            installer/uninstaller-publish/Uninstall-Veyro.exe
            dist/Veyro-Setup.exe
            LICENSE
            THIRD-PARTY-NOTICES.md
